name: One-time DualSense touchpad LED update

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add touchpad LED controls
        shell: python
        run: |
          from pathlib import Path

          p = Path("extension.js")
          s = p.read_text()

          anchor = "                    { opcode: 'setDualSenseMuteLED', blockType: Scratch.BlockType.COMMAND, text: 'set DualSense mute LED [STATE]', arguments: { STATE: { type: Scratch.ArgumentType.STRING, menu: 'muteLEDStates', defaultValue: 'On' } } },\n"
          blocks = anchor + "                    { opcode: 'turnOnDualSenseTouchpadLED', blockType: Scratch.BlockType.COMMAND, text: 'Turn on [ZONE] bottom DualSense Touchpad LED', arguments: { ZONE: { type: Scratch.ArgumentType.STRING, menu: 'touchpadLedZones', defaultValue: 'Middle' } } },\n                    { opcode: 'turnOffDualSenseTouchpadLED', blockType: Scratch.BlockType.COMMAND, text: 'Turn off [ZONE] bottom DualSense Touchpad LED', arguments: { ZONE: { type: Scratch.ArgumentType.STRING, menu: 'touchpadLedZones', defaultValue: 'Middle' } } },\n"
          if "turnOnDualSenseTouchpadLED" not in s:
              if anchor not in s:
                  raise SystemExit("Could not find mute LED block anchor")
              s = s.replace(anchor, blocks, 1)

          menu_anchor = "                    sticks: ['Left stick','Right stick'], directions: ['X','Y'], triggerSides: ['L','R'], muteLEDStates: ['On','Off'], adaptiveTriggers: ['L','R'], lightTransition: ['Fade','Instant'],"
          menu_replacement = "                    sticks: ['Left stick','Right stick'], directions: ['X','Y'], triggerSides: ['L','R'], muteLEDStates: ['On','Off'], touchpadLedZones: ['Middle','Left','Right'], adaptiveTriggers: ['L','R'], lightTransition: ['Fade','Instant'],"
          if "touchpadLedZones:" not in s:
              if menu_anchor not in s:
                  raise SystemExit("Could not find menu anchor")
              s = s.replace(menu_anchor, menu_replacement, 1)

          method_anchor = "        dualSenseMuteLED() {\n            return !!(this.dualSenseConnected() && this.dualSenseOutput.muteLed);\n        }\n"
          methods = method_anchor + """
        dualSenseTouchpadLedMask(zone) {
            // Five player LEDs under the touchpad, bits 0..4 left-to-right.
            // The three visible zones are the left pair, center LED, and right pair.
            switch (String(zone || 'Middle').toLowerCase()) {
                case 'left': return 0x03;
                case 'right': return 0x18;
                case 'middle':
                default: return 0x04;
            }
        }

        async turnOnDualSenseTouchpadLED(args) {
            if (!this.dualSenseConnected()) return false;
            const mask = this.dualSenseTouchpadLedMask(args && args.ZONE);
            return this.sendDualSenseOutput(output => {
                output.playerLeds = (output.playerLeds | mask) & 0x1F;
            });
        }

        async turnOffDualSenseTouchpadLED(args) {
            if (!this.dualSenseConnected()) return false;
            const mask = this.dualSenseTouchpadLedMask(args && args.ZONE);
            return this.sendDualSenseOutput(output => {
                output.playerLeds = output.playerLeds & (~mask & 0x1F);
            });
        }
"""
          if "dualSenseTouchpadLedMask(zone)" not in s:
              if method_anchor not in s:
                  raise SystemExit("Could not find mute LED method anchor")
              s = s.replace(method_anchor, methods, 1)

          p.write_text(s)

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-touchpad-led-update.yml touchpad-led-update-trigger.txt
          git add extension.js .github/workflows/one-time-touchpad-led-update.yml touchpad-led-update-trigger.txt
          git commit -m "Add DualSense touchpad LED controls"
          git push
