name: Restore v2 Adaptive Triggers

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore v2 adaptive triggers
        shell: python
        run: |
          import urllib.request
          import pathlib

          old = urllib.request.urlopen(
              "https://raw.githubusercontent.com/CubeHub-studio/Controller-extension/2164a477f87a53a13ca748045c40200e5e715ab6/extension.js"
          ).read().decode()

          p = pathlib.Path("extension.js")
          cur = p.read_text()

          old_start = old.index("        writeTriggerFeedback(")

          old_end = old.find(
              "Scratch.extensions.register",
              old_start
          )

          if old_end == -1:
              raise RuntimeError(
                  "Could not find Scratch.extensions.register in the v2 file"
              )

          old_region = old[old_start:old_end]

          old_send_start = old_region.index(
              "        async sendDualSenseTriggerOutput("
          )

          old_triggers = old_region[:old_send_start]
          old_send = old_region[old_send_start:]

          cur_start = cur.index("        setTriggerOff(")

          custom_start = cur.index(
              "        async customAdaptiveTriggerEffect(",
              cur_start
          )

          send_start = cur.index(
              "        async sendDualSenseTriggerOutput(",
              custom_start
          )

          class_end = cur.find(
              "Scratch.extensions.register",
              send_start
          )

          if class_end == -1:
              raise RuntimeError(
                  "Could not find Scratch.extensions.register in current file"
              )

          custom = cur[custom_start:send_start]

          cur = (
              cur[:cur_start]
              + old_triggers
              + "\n"
              + custom
              + "\n"
              + old_send
              + cur[class_end:]
          )

          cur = cur.replace(
              "r2Effect: new Uint8Array(11)",
              "r2Effect: new Uint8Array(10)"
          )

          cur = cur.replace(
              "l2Effect: new Uint8Array(11)",
              "l2Effect: new Uint8Array(10)"
          )

          p.write_text(cur)

          print("SUCCESS: restored the v2 adaptive-trigger implementation.")

      - name: Commit restored extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension.js
          git commit -m "Restore v2 adaptive trigger implementation" || echo "No changes"
          git push
